[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-crop-foundation-model"
version = "0.1.0"
description = "Manual S3 ingest + DINOv2 pretrain + ws/gs eval pipeline for UAV crop imagery."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pillow>=10.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "torchvision>=0.16",
  "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ucfm = "ucfm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
