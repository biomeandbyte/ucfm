name: Publish metrics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Sync logs and redraw the chart
        env:
          UCFM_S3_BUCKET: ${{ secrets.UCFM_S3_BUCKET }}
        run: |
          aws s3 sync "s3://${UCFM_S3_BUCKET}/logs/" data/logs/
          ucfm update-readme
      - name: Commit README and chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/performance.png
          git diff --staged --quiet || (git commit -m "metrics: publish from S3 logs" && git push)
